<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>借用登记</title>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="mobile-body">

<div class="mobile-shell">
  <div class="mobile-top">
    <div class="logo-big">📤</div>
    <h2>借用登记</h2>
    <p>扫码后填写信息即可完成借用</p>
  </div>

  <div id="deviceInfo"></div>
  <div id="alertBox"></div>

  <div id="formArea">
    <div class="form-card">
      <div class="field">
        <label class="field-label">姓名 <span class="req">*</span></label>
        <input class="field-input" id="fName" placeholder="请输入您的姓名" autocomplete="name">
      </div>
      <div class="field">
        <label class="field-label">手机号 <span class="req">*</span></label>
        <input class="field-input" id="fPhone" type="tel" maxlength="11" placeholder="请输入手机号" autocomplete="tel">
      </div>
      <div class="field">
        <label class="field-label">部门 / 班级</label>
        <input class="field-input" id="fDept" placeholder="选填，如：市场部 / 3班">
      </div>
      <button class="btn btn-primary btn-block btn-lg" onclick="submitAction()">✅ 确认借用</button>
    </div>
    <p class="form-tip">借用登记后请按时归还，归还时扫设备上的归还二维码</p>
  </div>

  <div id="resultArea" style="display:none;"></div>
</div>

<script src="js/config.js?v=4"></script>
<script src="js/store.js?v=4"></script>
<script src="js/common.js?v=4"></script>
<script src="js/mobile.js?v=4"></script>
</body>
</html>
